name: Registry Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: registry-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: camtr0n/xray-specs
          ref: 6d846c436d6cdb1d17de6e28bb84c9a317489d81 # collection/status metadata and venues
          path: .xray-specs
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .xray-specs/package-lock.json
      - run: npm ci && npm run build
        working-directory: .xray-specs
      - name: Build admitted registry
        run: |
          mkdir -p readings works
          node .xray-specs/packages/cli/dist/main.js registry-check .
          node .xray-specs/packages/site/dist/bin.js build . _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
